name: Sync Supabase → Neon

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync data to Neon
        run: |
          pip install requests psycopg2-binary
          python3 << 'PYEOF'
          import json, urllib.request, subprocess, os

          ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          BASE = "https://lpcepycxqfqzwwszmpks.supabase.co/rest/v1"
          NEON = "${{ secrets.NEON_CONNECTION_STRING }}"

          TABLES = [
              "churches", "songs", "members", "users", "church_song_status",
              "events", "event_songs", "event_rsvps", "event_user_access",
              "messages", "message_reads", "attendance_history",
              "user_favorites", "song_favorites", "song_submissions",
              "exercise_assignments", "smart_coach_exercises"
          ]

          def fetch_table(table):
              url = f"{BASE}/{table}?limit=10000"
              req = urllib.request.Request(url, headers={
                  "apikey": ANON_KEY,
                  "Authorization": f"Bearer {ANON_KEY}",
                  "Accept": "application/json"
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except Exception as e:
                  print(f"  Error fetching {table}: {e}")
                  return []

          def escape_val(v):
              if v is None: return "NULL"
              if isinstance(v, bool): return "true" if v else "false"
              if isinstance(v, (int, float)): return str(v)
              s = str(v).replace("'", "''")
              return f"'{s}'"

          import psycopg2
          conn = psycopg2.connect(NEON)
          cur = conn.cursor()

          for table in TABLES:
              print(f"Syncing {table}...")
              data = fetch_table(table)
              if not data:
                  print(f"  Empty, skipping")
                  continue

              keys = list(data[0].keys())
              col_str = ", ".join(f'"{k}"' for k in keys)

              # Disable triggers, clear, re-insert
              cur.execute(f'ALTER TABLE "{table}" DISABLE TRIGGER ALL')
              cur.execute(f'DELETE FROM "{table}"')

              for row in data:
                  vals = [row.get(k) for k in keys]
                  placeholders = ", ".join(["%s"] * len(vals))
                  try:
                      cur.execute(f'INSERT INTO "{table}" ({col_str}) VALUES ({placeholders}) ON CONFLICT DO NOTHING', vals)
                  except Exception as e:
                      conn.rollback()
                      cur.execute(f'ALTER TABLE "{table}" DISABLE TRIGGER ALL')
                      print(f"  Skip row: {e}")

              cur.execute(f'ALTER TABLE "{table}" ENABLE TRIGGER ALL')
              conn.commit()

              cur.execute(f'SELECT COUNT(*) FROM "{table}"')
              count = cur.fetchone()[0]
              print(f"  ✅ {len(data)} → {count} rows")

          cur.close()
          conn.close()
          print("Sync complete!")
          PYEOF
