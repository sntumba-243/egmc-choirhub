name: Sync Supabase → Neon

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Sync data to Neon
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os
          import psycopg2

          ANON_KEY = os.environ["SUPABASE_ANON_KEY"]
          BASE = "https://lpcepycxqfqzwwszmpks.supabase.co/rest/v1"
          NEON = os.environ["NEON_CONNECTION_STRING"]

          TABLES = [
              "churches", "songs", "members", "users", "church_song_status",
              "events", "event_songs", "event_rsvps", "event_user_access",
              "messages", "message_reads", "attendance_history",
              "user_favorites", "song_favorites", "song_submissions",
              "exercise_assignments", "smart_coach_exercises"
          ]

          def fetch_table(table):
              url = f"{BASE}/{table}?limit=10000"
              req = urllib.request.Request(url, headers={
                  "apikey": ANON_KEY,
                  "Authorization": f"Bearer {ANON_KEY}",
                  "Accept": "application/json"
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except Exception as e:
                  print(f"  Error fetching {table}: {e}")
                  return []

          conn = psycopg2.connect(NEON)
          conn.autocommit = False
          cur = conn.cursor()

          for table in TABLES:
              print(f"Syncing {table}...")
              data = fetch_table(table)
              if not data:
                  print(f"  Empty, skipping")
                  continue

              keys = list(data[0].keys())
              col_str = ", ".join(f'"{k}"' for k in keys)

              try:
                  cur.execute(f'ALTER TABLE "{table}" DISABLE TRIGGER ALL')
                  cur.execute(f'DELETE FROM "{table}"')

                  for row in data:
                      vals = [row.get(k) for k in keys]
                      placeholders = ", ".join(["%s"] * len(vals))
                      cur.execute(
                          f'INSERT INTO "{table}" ({col_str}) VALUES ({placeholders}) ON CONFLICT DO NOTHING',
                          vals
                      )

                  cur.execute(f'ALTER TABLE "{table}" ENABLE TRIGGER ALL')
                  conn.commit()

                  cur.execute(f'SELECT COUNT(*) FROM "{table}"')
                  count = cur.fetchone()[0]
                  print(f"  ✅ {len(data)} rows synced → {count} in Neon")

              except Exception as e:
                  conn.rollback()
                  print(f"  ❌ Failed {table}: {e}")

          cur.close()
          conn.close()
          print("Sync complete!")
          PYEOF
