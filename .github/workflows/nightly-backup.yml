name: Nightly Backup
on:
  schedule:
    - cron: '0 8 * * *'   # 3 AM Central daily
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node scripts/backup-all.mjs
        env:
          CI: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      - uses: actions/upload-artifact@v4
        if: always()   # keep the JSON snapshot even when the backup step fails (e.g. Neon down)
        with:
          name: backup-${{ github.run_id }}
          path: scripts/backup-*.json
          retention-days: 30
